# Entorno local completo de UrbanMove.
#
#   cp .env.example .env      # y rellena las contraseñas (nunca se sube al repo)
#   docker compose up -d --build
#   docker compose ps         # todos deben acabar en "healthy"
#
# Puertos de los servicios: docs/contracts/openapi/README.md
name: urbanmove

services:
  # Un único PostgreSQL con una base de datos y un usuario por servicio (ADR-001).
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: urbanmove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      SERVICE_DATABASES: zones
      ZONES_DB_PASSWORD: ${ZONES_DB_PASSWORD:?Define ZONES_DB_PASSWORD en .env}
    volumes:
      - ./infra/local/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # cambia POSTGRES_PORT en .env si ya tienes otro PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanmove -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # DynamoDB, SNS, SQS, S3, Lambda y EventBridge en local.
  # 4.14.0: la misma versión que la práctica 4. Las versiones nuevas (2026.x) piden cuenta y LOCALSTACK_AUTH_TOKEN.
  # Al arrancar, init-aws.sh crea el tópico SNS y una cola SQS (con su DLQ) por consumidor.
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: dynamodb,sns,sqs,s3,lambda,events,logs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/local/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      # "healthy" solo cuando init-aws.sh ha terminado (tópico y colas creados)
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -Eq '\"completed\": ?true'"]
      interval: 5s
      timeout: 3s
      retries: 30

  zones:
    build:
      context: ./services
      dockerfile: zones/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/zones
      DB_USER: zones
      DB_PASSWORD: ${ZONES_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  availability:
    build:
      context: ./services
      dockerfile: availability/Dockerfile
    environment:
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      # Credenciales ficticias que acepta LocalStack (no son secretos). En ECS se usa el rol LabRole.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_TABLE: urbanmove-availability
      DYNAMODB_CREATE_TABLE: "true"      # en AWS la tabla la crea Terraform
      # Su cola del bus de eventos (la crea init-aws.sh, con DLQ y filtro por eventType)
      EVENTS_QUEUE_URL: http://localstack:4566/000000000000/availability-queue
      # Flota inicial: los 100 vehículos del generador sintético
      FLEET_SEED_FILE: classpath:seed/vehicles.json
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
    ports:
      - "8082:8080"
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped

  maintenance:
    build:
      context: ./services
      dockerfile: maintenance/Dockerfile
    environment:
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      # Credenciales ficticias que acepta LocalStack (no son secretos). En ECS se usa el rol LabRole.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_TABLE: urbanmove-maintenance
      DYNAMODB_CREATE_TABLE: "true"      # en AWS la tabla la crea Terraform
      EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:urbanmove-domain-events
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
    ports:
      - "8084:8080"
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
